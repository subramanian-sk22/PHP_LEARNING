# PHP Placement MCQ Roadmap

Assumption: PHP 8.x unless a question explicitly says otherwise. Questions are arranged roughly from easy to hard within each day. Try each section before checking its answer key.

## Day 1 — PHP Basics & Syntax (50 MCQs)

1. Which opening tag is recommended for a PHP file?  
A. `<?php`  B. `<?`  C. `<php>`  D. `<?php?>`
2. Which symbol starts a PHP variable name?  
A. `#`  B. `$`  C. `@`  D. `%`
3. Which statement outputs text in PHP?  
A. `echo "Hello";`  B. `write "Hello";`  C. `display("Hello");`  D. `show "Hello";`
4. Which statement is also commonly used to output text?  
A. `print "Hello";`  B. `println "Hello";`  C. `out "Hello";`  D. `send "Hello";`
5. Which line correctly assigns the integer 25 to a variable?  
A. `$age = 25;`  B. `age := 25;`  C. `$age == 25;`  D. `var age = 25;`
6. PHP statements normally end with which character?  
A. `:`  B. `.`  C. `;`  D. `,`
7. Which is a valid PHP variable name?  
A. `$2name`  B. `$user_name`  C. `$user-name`  D. `$user name`
8. PHP variable names are case-sensitive. Which pair represents two different variables?  
A. `$x` and `$x`  B. `$name` and `$Name`  C. `$a1` and `$a1`  D. `$_id` and `$_id`
9. What is the type of `"42"`?  
A. `int`  B. `float`  C. `string`  D. `bool`
10. Which value represents Boolean false?  
A. `"false"`  B. `0`  C. `"0"` only  D. `-1`
11. Which operator concatenates strings?  
A. `+`  B. `&`  C. `.`  D. `::`
12. What does `echo "PHP", "8";` print?  
A. `PHP 8`  B. `PHP8`  C. `PHP,8`  D. It causes an error
13. Which function returns the data type of a value?  
A. `typeof()`  B. `gettype()`  C. `datatype()`  D. `typeOfValue()`
14. Which function checks whether a variable exists?  
A. `exists()`  B. `isset()`  C. `defined()`  D. `available()`
15. What does `isset($x)` return when `$x` is undefined?  
A. `true`  B. `false`  C. `null`  D. An integer error code
16. What does `var_dump(10);` display information about?  
A. Only the value  B. The type and value  C. Only the type  D. The memory address only
17. Which value is the PHP null value?  
A. `nil`  B. `None`  C. `null`  D. `empty`
18. What is the result of `5 + 2 * 3`?  
A. `21`  B. `11`  C. `15`  D. `13`
19. Which operator calculates a remainder?  
A. `/`  B. `//`  C. `%`  D. `mod`
20. What is the result of `17 % 5`?  
A. `2`  B. `3`  C. `4`  D. `5`
21. Which operator checks equality without type conversion?  
A. `=`  B. `==`  C. `===`  D. `!=`
22. What is the result of `5 == "5"`?  
A. `true`  B. `false`  C. `null`  D. A syntax error
23. What is the result of `5 === "5"`?  
A. `true`  B. `false`  C. `5`  D. A warning
24. Which operator means “not identical”?  
A. `<>` only  B. `!==`  C. `not==`  D. `!= =`
25. What does `$x += 4;` do?  
A. Assigns 4 only  B. Adds 4 to `$x` and assigns it  C. Compares `$x` with 4  D. Concatenates 4 only
26. What is the value of `$x` after `$x = 3; $x++;`?  
A. `2`  B. `3`  C. `4`  D. `33`
27. Which operator performs logical AND?  
A. `||`  B. `&&`  C. `andalso`  D. `&=`
28. Which operator performs logical OR with short-circuit behavior?  
A. `|`  B. `||`  C. `oror`  D. `OR=`
29. What is the result of `true && false`?  
A. `true`  B. `false`  C. `null`  D. `1`
30. Which operator returns the first operand if it is not null, otherwise the second?  
A. `?:`  B. `??`  C. `||=`  D. `=>`
31. What is the value of `$name` after `$name = null; $name ??= "Guest";`?  
A. `null`  B. `"Guest"`  C. `false`  D. It is undefined
32. Which syntax embeds a variable inside a double-quoted string?  
A. `"Hello $name"`  B. `'Hello $name'`  C. `"Hello + name"`  D. `"Hello {$name}"` is invalid
33. What does single-quoted `'Price: $10'` do with `$10`?  
A. Interpolates a variable  B. Treats it as literal text  C. Throws a parse error  D. Converts it to 10
34. Which escape sequence represents a newline in a double-quoted string?  
A. `\n`  B. `\l`  C. `\newline`  D. `/n`
35. Which operator has higher precedence in `$a = true || false` than assignment?  
A. `||`  B. `=`  C. Both equal  D. Neither is evaluated
36. What is the result of `"10" + 5` in PHP 8?  
A. String `"105"`  B. Integer `15`  C. Float `15.0`  D. A TypeError
37. What is the result of `"10 apples" + 5` in PHP 8?  
A. Integer `15`  B. String `"10 apples5"`  C. A TypeError  D. `false`
38. Which function converts a value to an integer?  
A. `intval()`  B. `toInteger()`  C. `integer()`  D. `parse_int()`
39. What does `(float) "3.14"` produce?  
A. A string  B. A float  C. An integer  D. A Boolean
40. Which constant contains the current PHP version?  
A. `PHP_VERSION`  B. `VERSION_PHP`  C. `PHP_RELEASE`  D. `CURRENT_PHP`
41. Which predefined constant gives the current line number?  
A. `__ROW__`  B. `__LINE__`  C. `CURRENT_LINE`  D. `__NUMBER__`
42. What does `define("APP_ENV", "dev");` create?  
A. A variable  B. A constant  C. A class  D. A namespace
43. Which is the preferred constant declaration inside a class?  
A. `static APP = 1;`  B. `const APP = 1;`  C. `constant APP = 1;`  D. `$const APP = 1;`
44. What happens when code attempts to change a defined constant?  
A. It changes normally  B. PHP reports an error/warning and does not redefine it  C. It becomes a variable  D. It is silently ignored in all versions
45. Which comment syntax creates a single-line comment?  
A. `// note`  B. `<!-- note -->` only  C. `** note`  D. `\ note`
46. Which syntax creates a multiline comment?  
A. `/* comment */`  B. `// comment //`  C. `## comment ##`  D. `<comment>...</comment>`
47. What does `print` return?  
A. The printed string  B. `1` on success  C. `true` always  D. `void`
48. Which statement is true about `echo`?  
A. It accepts multiple comma-separated arguments  B. It can only print integers  C. It always returns a value  D. It must use parentheses
49. What does `echo 1 . 2;` print?  
A. `3`  B. `12`  C. `1.2`  D. It throws a TypeError
50. What does `echo "Total: $a";` print if `$a` is undefined?  
A. The literal `$a` with no notice  B. An undefined-variable warning plus an empty value in typical PHP 8 execution  C. `null` as text  D. A parse error

## Day 2 — Control Structures & Functions (50 MCQs)

1. Which keyword begins a conditional branch?  
A. `if`  B. `when`  C. `check`  D. `condition`
2. Which block runs when an `if` condition is false?  
A. `otherwise`  B. `else`  C. `default`  D. `fallback`
3. Which construct tests another condition after an `if`?  
A. `else if`  B. `elseifonly`  C. `nextif`  D. `elif` in PHP syntax
4. Which keyword handles unmatched cases in a `switch`?  
A. `otherwise`  B. `default`  C. `fallback`  D. `elsecase`
5. What does `break` do inside a `switch` case?  
A. Exits the switch  B. Restarts the case  C. Skips only the next statement  D. Ends the PHP file
6. What is the purpose of `continue` in a loop?  
A. Exits the loop  B. Skips to the next iteration  C. Repeats the current statement forever  D. Pauses execution
7. Which loop is guaranteed to execute its body at least once?  
A. `for`  B. `while`  C. `do...while`  D. `foreach`
8. Which loop is best suited to iterate over array values?  
A. `foreach`  B. `repeat`  C. `iterate`  D. `loop-array`
9. What is the correct `for` syntax?  
A. `for ($i=0; $i<5; $i++)`  B. `for $i from 0 to 5`  C. `for ($i=0, $i<5, $i++)`  D. `loop ($i=0; $i<5; $i++)`
10. How many times does `for ($i=0; $i<3; $i++)` execute?  
A. 2  B. 3  C. 4  D. Infinite times
11. What does `while (false) { ... }` do?  
A. Executes once  B. Never executes  C. Executes twice  D. Causes a parse error
12. What does `do { ... } while (false);` do?  
A. Never executes  B. Executes once  C. Executes infinitely  D. Is invalid syntax
13. In `foreach ($items as $item)`, what does `$item` contain?  
A. The key  B. The current value  C. The array length  D. The next index only
14. Which syntax captures both an array key and value?  
A. `foreach ($a as $key => $value)`  B. `foreach ($a key $key value $value)`  C. `foreach ($a as $key, $value)`  D. `foreach ($a => $key as $value)`
15. What does `break 2;` do inside nested loops?  
A. Skips two iterations  B. Exits two nested loop/switch levels  C. Breaks two variables  D. Causes a fatal error
16. Which statement selects a value based on a condition and returns a result?  
A. `if` expression only  B. Ternary operator `condition ? a : b`  C. `choose()`  D. `select`
17. What is `$x` after `$x = 4 > 2 ? "yes" : "no";`?  
A. `true`  B. `"yes"`  C. `"no"`  D. `4`
18. Which PHP 8 construct compares values using identity and supports expressions?  
A. `switch` only  B. `match`  C. `choose`  D. `caseof`
19. What does `match` use for comparison?  
A. Loose `==`  B. Strict `===`  C. String comparison only  D. Numeric comparison only
20. What happens if no arm matches in a `match` expression and no `default` exists?  
A. Returns null  B. Throws `UnhandledMatchError`  C. Uses the first arm  D. Prints an error and continues
21. Which keyword declares a function?  
A. `func`  B. `function`  C. `define_function`  D. `method`
22. What does a function with no explicit `return` return?  
A. `false`  B. `0`  C. `null`  D. An empty string
23. Which syntax calls a function named `sum`?  
A. `call sum;`  B. `sum();`  C. `function sum();`  D. `run(sum)`
24. What is a parameter?  
A. A value supplied during a call  B. A variable declared in a function definition  C. The function result  D. A global constant
25. What is an argument?  
A. A variable in the definition  B. A value passed to a function call  C. A return type  D. A namespace alias
26. Which declaration gives a default parameter value?  
A. `function f($x = 10) {}`  B. `function f(default $x 10) {}`  C. `function f($x := 10) {}`  D. `function f($x default 10) {}`
27. A required parameter should generally appear where relative to optional parameters?  
A. After them  B. Before them  C. Anywhere  D. Only inside a class
28. What does `function add(int $a, int $b): int` declare?  
A. Two string parameters  B. Integer parameter and return type declarations  C. A class method only  D. A constant
29. Which return type allows a function to return either an integer or null?  
A. `?int`  B. `nullable<int>`  C. `int?` only  D. `maybe int`
30. What does `...$numbers` in a parameter list provide?  
A. A reference only  B. Variadic arguments collected into an array  C. A generator  D. A spread string
31. What does pass-by-reference use?  
A. `*`  B. `&`  C. `ref:`  D. `=>`
32. Which variable scope is local to a function by default?  
A. Variables created inside that function  B. All variables in the file  C. All `$_POST` values  D. Constants only
33. Which keyword imports a global variable into a function scope?  
A. `global`  B. `extern`  C. `useglobal`  D. `import`
34. What is a safer alternative to many `global` variables?  
A. Passing values as parameters  B. Making every variable static  C. Using `eval`  D. Printing the values
35. What does `static $count = 0;` inside a function do?  
A. Resets on every call  B. Preserves the local value between calls  C. Makes the variable global  D. Makes it a class property
36. What does an anonymous function represent?  
A. A function without a name  B. A function that cannot return  C. A private class  D. A built-in function
37. Which syntax assigns a closure to `$double`?  
A. `$double = fn($x) => $x * 2;`  B. `$double = lambda $x: $x*2;`  C. `$double = function => ($x*2);`  D. `$double := closure($x);`
38. What does `use ($tax)` do in a closure?  
A. Imports `$tax` from the surrounding scope  B. Declares `$tax` as a class  C. Makes `$tax` a constant  D. Calls a function named tax
39. Arrow functions automatically capture outer variables by what behavior?  
A. By value  B. By reference always  C. Only if global  D. They cannot capture variables
40. Which built-in function applies a callback to each array element and returns a new array?  
A. `array_map()`  B. `array_each()`  C. `map_array_in_place()`  D. `apply_array()`
41. Which function filters an array using a callback?  
A. `array_select()`  B. `array_filter()`  C. `filter_values_only()`  D. `where_array()`
42. What does `count([])` return?  
A. `-1`  B. `0`  C. `1`  D. `null`
43. What does recursion mean?  
A. A function calls itself with a terminating condition  B. A loop calls a class  C. A variable changes type  D. A function has many parameters
44. What is the main danger of missing a recursion base case?  
A. It always returns null  B. Infinite recursion/stack exhaustion  C. It converts values to strings  D. It disables errors
45. Which keyword stops a function and optionally sends a value to its caller?  
A. `yield`  B. `return`  C. `exitloop`  D. `send`
46. What does `exit("Failed");` do?  
A. Throws a catchable exception only  B. Prints the message and terminates the script  C. Continues with the next function  D. Returns from the current loop only
47. What does `die()` do?  
A. It is an alias of `exit()`  B. It deletes the current file  C. It pauses execution  D. It catches fatal errors
48. Which construct handles exceptions?  
A. `try`, `catch`, and optionally `finally`  B. `check`, `handle`, `recover`  C. `if`, `else`, `end`  D. `attempt`, `rescue`, `ensure`
49. What does a `finally` block generally do?  
A. Runs only when no exception exists  B. Runs after try/catch processing for cleanup  C. Replaces the catch block  D. Prevents all exceptions
50. What does `yield` make a function behave like?  
A. A generator that can pause and resume  B. A constant  C. A constructor  D. A database transaction

## Day 3 — Strings & Arrays (60 MCQs)

1. Which function returns the length of a string?  
A. `strlen()`  B. `strsize()`  C. `length()`  D. `count_chars_only()`
2. What is `strlen("PHP")`?  
A. `2`  B. `3`  C. `4`  D. `0`
3. Which function converts a string to lowercase?  
A. `lower()`  B. `strtolower()`  C. `toLowerCase()`  D. `strlowercase()`
4. Which function converts a string to uppercase?  
A. `strtoupper()`  B. `upperstr()`  C. `toUpper()`  D. `uppercase()`
5. Which function removes whitespace from both ends of a string?  
A. `strip()`  B. `trim()`  C. `clean()`  D. `chopspaces()`
6. Which function replaces all matching substrings?  
A. `str_replace()`  B. `replace_string_once()`  C. `swapstr()`  D. `substitute_all()`
7. What does `str_replace("a", "o", "cat")` return?  
A. `cot`  B. `cat`  C. `oat`  D. `co t`
8. Which function searches for a substring and returns its first position?  
A. `strfind()`  B. `strpos()`  C. `indexOf()`  D. `findstr()`
9. What special check is needed when using `strpos()`?  
A. Compare with `== true`  B. Use strict comparison because position 0 is valid  C. Convert the result to float  D. Call it twice
10. What does `strpos("PHP", "P")` return?  
A. `0`  B. `1`  C. `-1`  D. `false`
11. Which function extracts part of a string?  
A. `substring()`  B. `substr()`  C. `slice_string()`  D. `cutstr()`
12. What does `substr("abcdef", 2, 2)` return?  
A. `ab`  B. `bc`  C. `cd`  D. `cde`
13. Which function compares two strings case-insensitively?  
A. `strcasecmp()`  B. `strcomparei()`  C. `same_string()`  D. `strcmpi_only()`
14. Which function compares two strings case-sensitively?  
A. `strcmp()`  B. `strsame()`  C. `compare_case()`  D. `equalstr()`
15. What does `strcmp("a", "b")` return conceptually?  
A. Always `true`  B. A negative integer  C. The string `false`  D. The index of b
16. Which function splits a string into an array?  
A. `explode()`  B. `split_array()`  C. `divide_string()`  D. `str_to_array_only()`
17. What is `explode(",", "a,b,c")`?  
A. `"a,b,c"`  B. `['a','b','c']`  C. `[',', 'a,b,c']`  D. `null`
18. Which function joins array elements into one string?  
A. `implode()`  B. `join_string_only()`  C. `combine_text()`  D. `merge_string()`
19. What does `implode("-", [1,2,3])` return?  
A. `123`  B. `1-2-3`  C. `1,2,3`  D. `[1-2-3]`
20. Which function removes HTML and PHP tags from a string?  
A. `strip_tags()`  B. `remove_markup()`  C. `html_delete()`  D. `clean_html_all()`
21. Which function escapes HTML special characters for safe output?  
A. `htmlspecialchars()`  B. `escape_html_tags_only()`  C. `safe_html()`  D. `htmlencodeall()`
22. Which function URL-encodes a string?  
A. `urlencode()`  B. `encode_url_only()`  C. `url_escape_all()`  D. `httpencode()`
23. Which function formats a string using placeholders such as `%s`?  
A. `sprintf()`  B. `format_string_php()`  C. `printf_string()`  D. `string_template()`
24. What does `printf("%d", 7.9)` print?

  <script>
    const source = document.getElementById("markdown-source").textContent.trim();
    const content = document.getElementById("content");

    function escapeHtml(value) {
      return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function richText(value) {
      return escapeHtml(value).replace(new RegExp("`([^`]+)`", "g"), "<code>$1</code>");
    }

    function optionsFrom(line) {
      return line.split(/\s{2,}(?=[A-D]\.\s)/).map(part => part.replace(/^[A-D]\.\s*/, "").trim()).filter(Boolean);
    }

    function renderMarkdown(markdown) {
      const lines = markdown.split(/\r?\n/);
      let output = "";
      let dayOpen = false;
      let listOpen = false;
      let answerOpen = false;
      let questionCount = 0;

      function closeList() {
        if (listOpen) { output += "</ul>"; listOpen = false; }
      }
      function closeAnswer() {
        if (answerOpen) { output += "</div></details>"; answerOpen = false; }
      }
      function closeDay() {
        closeList();
        closeAnswer();
        if (dayOpen) { output += "</div></section>"; dayOpen = false; }
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trimEnd();
        if (!line.trim()) { closeList(); continue; }

        if (line.startsWith("# PHP Placement")) continue;

        if (line.startsWith("## Day ")) {
          closeDay();
          const title = line.replace(/^## /, "").replace(/\s*\(\d+ MCQs\)$/, "");
          const dayMatch = title.match(/Day (\d+)/);
          const id = dayMatch ? "day-" + dayMatch[1] : "day";
          output += '<section class="day" id="' + id + '"><h2>' + richText(title) + '</h2><div class="day-body">';
          dayOpen = true;
          continue;
        }

        if (line.startsWith("## Recommended")) {
          closeDay();
          output += '<section class="routine"><h2>' + richText(line.replace(/^## /, "")) + '</h2>';
          continue;
        }

        if (line.startsWith("### ")) {
          closeList();
          closeAnswer();
          const heading = line.replace(/^### /, "");
          if (/answer key/i.test(heading)) {
            output += '<details><summary>' + richText(heading) + '</summary><div class="answer-content">';
            answerOpen = true;
          } else {
            output += '<h3>' + richText(heading) + '</h3>';
          }
          continue;
        }

        const question = line.match(/^(\d+)\.\s+(.*)$/);
        if (question) {
          closeList();
          const optionLine = (lines[i + 1] || "").trim();
          const choices = optionsFrom(optionLine);
          if (choices.length === 4) i++;
          questionCount++;
          output += '<article class="question" data-question="' + questionCount + '"><p><span class="q-number">' + question[1] + '</span>' + richText(question[2]) + '</p>';
          if (choices.length) {
            output += '<ol class="options">';
            choices.forEach(choice => { output += '<li>' + richText(choice) + '</li>'; });
            output += '</ol>';
          }
          output += '</article>';
          continue;
        }

        if (line.startsWith("- ")) {
          if (!listOpen) { output += '<ul class="routine-list">'; listOpen = true; }
          output += '<li>' + richText(line.slice(2)) + '</li>';
          continue;
        }

        closeList();
        output += '<p>' + richText(line) + '</p>';
      }

      closeDay();
      closeList();
      closeAnswer();
      return output;
    }

    content.innerHTML = renderMarkdown(source);

    const search = document.getElementById("search");
    const noResults = document.getElementById("no-results");
    search.addEventListener("input", () => {
      const query = search.value.toLowerCase().trim();
      let visible = 0;
      document.querySelectorAll(".question").forEach(question => {
        const matches = !query || question.textContent.toLowerCase().includes(query);
        question.classList.toggle("hidden-question", !matches);
        if (matches) visible++;
      });
      noResults.style.display = visible ? "none" : "block";
    });

    let answersVisible = false;
    document.getElementById("answers").addEventListener("click", event => {
      answersVisible = !answersVisible;
      document.querySelectorAll("details").forEach(detail => detail.open = answersVisible);
      event.currentTarget.textContent = answersVisible ? "Hide all answers" : "Show all answers";
    });
    document.getElementById("print").addEventListener("click", () => window.print());
  </script>
